<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Verification</title>
    <style>
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }
        .message {
            font-size: 20px;
            font-weight: 300;
            color: #555555;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="message">Please enter the correct link</div>
        <div class="message">請輸入正確的鏈結</div>
        <div class="message">Veuillez entrer le bon lien</div>
        <div class="message">正しいリンクを入力してください</div>
        <div class="message">올바른 링크를 입력하세요</div>
    </div>

</body>
</html>
